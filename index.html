function pdfResumoBancoHoras(){if(!fullLinks())return alert('Somente logins oficiais podem gerar este relatório.');const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');let raw=DB.g('linkcia',[]);if(!Array.isArray(raw)&&raw&&typeof raw==='object')raw=Object.values(raw);if(!Array.isArray(raw))raw=[];const accepted=['aceito','aceita','aprovado','aprovada','accepted','aprovadopelooficial','deferido','deferida'];let a=raw.filter(x=>norm(x.cat).includes('bancodehoras')&&accepted.includes(norm(x.status)));if(!a.length)return alert('Nenhuma solicitação aceita encontrada para gerar o relatório.');const monthOf=x=>{let d=String(x.d||x.data||x.dataSolicitacao||'').trim(),m=d.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2];m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]:'Data não informada'};let months={};for(let x of a){let mes=monthOf(x),cia=String(x.cia||'Cia não informada'),re=String(x.re||x.RE||'').trim(),nome=String(x.nome||x.nomeGuerra||x.nome_de_guerra||'').trim(),key=norm(cia)+'|'+re+'|'+norm(nome);if(!months[mes])months[mes]={};if(!months[mes][key])months[mes][key]={cia,re,nome,horas:0,raw:[],qtd:0};let z=months[mes][key],t=String(x.tempo||x.tempoUltrapassado||x.horas||'').trim(),m=t.match(/^(\d+(?:[.,]\d+)?)\s*h(?:oras?)?$/i),hm=t.match(/^(\d{1,3}):(\d{2})$/),min=t.match(/^(\d+(?:[.,]\d+)?)\s*(?:min|minuto|minutos)$/i),val=m?parseFloat(m[1].replace(',','.')):hm?(+hm[1]+(+hm[2]/60)):min?(parseFloat(min[1].replace(',','.'))/60):(/^\d+(?:[.,]\d+)?$/.test(t)?parseFloat(t.replace(',','.')):NaN);if(Number.isFinite(val))z.horas+=val;z.raw.push(t);z.qtd++}const monthLabel=k=>{if(k==='Data não informada')return k;let [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};let sections=Object.keys(months).sort().map(mes=>{let list=Object.values(months[mes]).sort((a,b)=>a.cia.localeCompare(b.cia,'pt-BR')||a.nome.localeCompare(b.nome,'pt-BR'));let tot
